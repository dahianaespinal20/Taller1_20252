{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="container my-4">
<h1 class="text-center mb-4">Noticias</h1>
<div class="row justify-content-center">
<div class="col-12 col-md-10 col-lg-8">
     {% for n in news %}
<div class="card mb-3 shadow-sm mx-auto" style="max-width: 900px;">
<div class="row g-0">
<div class="col-md-4">
           {% if n.image %}
<img src="{{ n.image.url }}" class="img-fluid rounded-start h-100 w-100 object-fit-cover" alt="{{ n.headline }}">
           {% else %}
<img src="{% static 'img/news-placeholder.jpg' %}" class="img-fluid rounded-start h-100 w-100 object-fit-cover" alt="noticia">
           {% endif %}
</div>
<div class="col-md-8">
<div class="card-body">
<h5 class="card-title">{{ n.headline }}</h5>
<p class="card-text">{{ n.body }}</p>
<p class="card-text"><small class="text-body-secondary">{{ n.date|date:"M. d, Y" }}</small></p>
</div>
</div>
</div>
</div>
     {% empty %}
<p class="text-center text-muted">No hay noticias.</p>
     {% endfor %}
</div>
</div>
</div>
{% endblock content %}
